<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Table Example</title>
</head>
<body>
    <table border="1">
        <tr>
            <th>Column1</th>
            <th>Column2</th>
            <th>Column3</th>
        </tr>
        <tr>
            <td rowspan="2">Kuldip</td>
            <td>Sabbir</td>
            <td>Nafis</td>
        </tr>
        <tr>
            <td>Rahat</td>
            <td>Sahriar</td>
        </tr>
        <tr>
            <td colspan="3">Alamin</td>
        </tr>
    </table>
</body>
</html>
